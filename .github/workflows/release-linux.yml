name: Release (Linux only)

# Manually triggered Linux-only release: builds the .deb and publishes it to the
# signed APT repo in docs/ (GitHub Pages). No git tag, no GitHub Release, no
# Windows/macOS builds. Run it from the Actions tab on the main branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.10.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apt-repo-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Run this workflow from main (it pushes the updated APT repo to main)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.10.1 (no leading v, no prerelease suffix): got '$VERSION'"
            exit 1
          fi
          if [ -e "docs/pool/main/o/omnihear/omnihear_${VERSION}_amd64.deb" ]; then
            echo "omnihear ${VERSION} is already in the APT repo; pick a new version."
            exit 1
          fi

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build .deb
        run: ./build-deb.sh "${{ inputs.version }}"

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
        env:
          GNUPGHOME: /home/runner/.gnupg

      - name: Update signed APT repo
        env:
          GNUPGHOME: /home/runner/.gnupg
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_TTY: /dev/tty
        run: |
          # allow non-interactive signing with a passphrase-protected key
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          gpgconf --reload gpg-agent
          export GPG_OPTS="--pinentry-mode loopback --passphrase ${{ secrets.GPG_PASSPHRASE }}"
          ./scripts/update-apt-repo.sh "omnihear_${{ inputs.version }}_amd64.deb"

      - name: Commit and push updated repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/
          git commit -m "Publish omnihear ${{ inputs.version }} (Linux only)"
          git push origin HEAD:main

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: omnihear_${{ inputs.version }}_amd64.deb
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: gpgconf --kill gpg-agent && rm -rf /home/runner/.gnupg
